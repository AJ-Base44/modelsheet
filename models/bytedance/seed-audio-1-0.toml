[[limitations]]
id = "maximum-output-duration"
summary = "BytePlus states that generated audio is limited to 120 seconds, but does not publish a complete minimum-to-maximum duration range; original_duration is capped at 120 seconds and is the billing duration."
source_ids = ["audio-api"]

[[limitations]]
id = "non-streaming-api"
summary = "BytePlus describes the HTTP Audio 1.0 endpoint as non-streaming."
source_ids = ["audio-api"]

[[limitations]]
id = "temporary-url-expiry"
summary = "Returned audio URLs are valid for two hours."
source_ids = ["audio-api"]

[pricing]
state = "known"
source_ids = ["pricing"]

[[pricing.charges]]
id = "timbre-audio-generation"
state = "known"
kind = "metered"
amount = 14
denomination = "point"
per = 1
unit = "original_audio_second"
qualifier = "BytePlus Dramagic publishes 14 points per second and labels this as equivalent to USD 0.14 per second; billing uses the model's original_duration before speed adjustment or post-processing."
source_ids = ["audio-api", "pricing"]

[[conflicts]]
path = "capability_profiles.audio_formats.sample_rates"
summary = "The API reference lists valid sample rates as 8000, 16000, 24000, 32000, 44100, and 48000 Hz, but separately states a 40000 Hz default for WAV and PCM, which is absent from that valid-value list."
handling = "Record only the explicit valid-value set and leave per-format defaults unmodeled until BytePlus resolves the contradiction."
source_ids = ["audio-api"]

