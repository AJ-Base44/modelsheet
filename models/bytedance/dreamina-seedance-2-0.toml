[[limitations]]
id = "direct-real-human-face-input"
summary = "BytePlus states that Seedance 2.0 series models do not support directly uploaded reference images or videos containing real human faces; trusted generated outputs, preset digital characters, or authorized real-person assets are the documented alternatives."
source_ids = ["video-api"]

[[limitations]]
id = "generated-audio-mono"
summary = "BytePlus states that generated videos with audio use mono output regardless of the input audio channel count."
source_ids = ["video-api"]

[[limitations]]
id = "precise-timing-instability"
summary = "BytePlus states that precise prompt timing such as 0–3 second segments is unstable and that forcing strict segment durations may cause abnormal generation results."
source_ids = ["prompt-guide"]

[[limitations]]
id = "narration-end-noise"
summary = "BytePlus states that videos with narration are likely to contain abrupt clicks or cut-off noise at the end."
source_ids = ["prompt-guide"]

