[capability_profiles.native_audio]
state = "not_applicable"
source_ids = ["generate-api"]

[[capability_profiles.reference_inputs]]
role = "style_reference"
media_type = "image"
state = "supported"
min_count = 0
max_count = 3
formats = ["jpeg", "png", "webp"]
constraints = ["aggregate_max_file_size=10 MB"]
source_ids = ["model-page", "generate-api"]

[[capability_profiles.reference_inputs]]
role = "character_reference"
media_type = "image"
state = "supported"
min_count = 0
max_count = 1
formats = ["jpeg", "png", "webp"]
constraints = ["aggregate_max_file_size=10 MB"]
source_ids = ["generate-api"]

[[capability_profiles.reference_inputs]]
role = "character_reference_mask"
media_type = "image_mask"
state = "supported"
min_count = 0
max_count = 1
formats = ["jpeg", "png", "webp"]
constraints = [
  "count_must_match_character_reference_images=true",
  "image_mode=grayscale",
  "dimensions_must_match_corresponding_character_reference=true",
]
source_ids = ["generate-api"]

[[capability_profiles.delivery_profiles]]
id = "synchronous-temporary-url"
state = "supported"
transport = "temporary_url"
endpoint = "POST /v1/ideogram-v3/generate"
source_ids = ["generate-api"]

[[capability_profiles.controls]]
name = "prompt_input_mode"
state = "supported"
mode = "exact_set"
values = ["text_prompt"]
source_ids = ["generate-api"]

[[capability_profiles.controls]]
name = "request_seed"
state = "supported"
mode = "range"
min = 0
max = 2147483647
step = 1
source_ids = ["generate-api"]

[[capability_profiles.controls]]
name = "rendering_speed"
state = "supported"
mode = "exact_set"
values = ["FLASH", "TURBO", "DEFAULT", "QUALITY"]
default = "DEFAULT"
source_ids = ["generate-api"]

[[capability_profiles.controls]]
name = "magic_prompt"
state = "supported"
mode = "exact_set"
values = ["AUTO", "ON", "OFF"]
source_ids = ["generate-api"]

[[capability_profiles.controls]]
name = "output_count"
state = "supported"
mode = "range"
min = 1
max = 8
step = 1
default = 1
source_ids = ["generate-api"]

[[capability_profiles.controls]]
name = "style_type"
state = "supported"
mode = "exact_set"
values = ["AUTO", "GENERAL", "REALISTIC", "DESIGN", "FICTION"]
default = "GENERAL"
source_ids = ["generate-api"]

[[capability_profiles.controls]]
name = "enable_copyright_detection"
state = "supported"
mode = "exact_set"
values = ["false", "true"]
source_ids = ["generate-api"]

[[limitations]]
id = "temporary-hosted-output-links"
summary = "Ideogram says generated image links remain available only for a limited period and must be downloaded for durable storage."
source_ids = ["generate-api"]

[pricing]
state = "partial"
source_ids = ["pricing"]

[[pricing.charges]]
id = "text-to-image-flash"
state = "known"
kind = "metered"
amount = 0.03
denomination = "USD"
per = 1
unit = "output_image"
profile_id = "image-generation"
applies_when = ["rendering_speed=FLASH", "character_reference_images=absent"]
source_ids = ["pricing"]

[[pricing.charges]]
