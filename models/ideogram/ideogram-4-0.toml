qualifier = "Ideogram publishes no universal per-output cost for self-hosted inference; cost depends on the compute provisioned by the operator."
source_ids = ["model-page", "open-inference"]

[[conflicts]]
path = "capability_profiles.text-to-image.size.options"
summary = "The visible Generate summary refers to 2K output and a collapsed view of 23 choices, while the live embedded request schema enumerates 38 exact 1K and 2K resolutions."
handling = "Record all 38 values from the callable request schema and retain the shorter visible summary as conflicting documentation."
source_ids = ["generate-api", "model-page", "release-announcement"]

[[conflicts]]
path = "capability_profiles.*.controls.rendering_speed, pricing.charges.*"
summary = "Generate explicitly says FLASH is coming soon and currently returns HTTP 400; Remix still exposes FLASH in its enum without that warning, and the pricing table lists no 4.0 Flash rate."
handling = "Mark FLASH unsupported for Generate, retain it as an exposed but unresolved Remix enum value, and leave its Remix price unknown."
source_ids = ["generate-api", "generate-async-api", "remix-api", "pricing"]

[[conflicts]]
path = "capability_profiles.image-edit, capability_profiles.image-reframe, capability_profiles.replace-background"
summary = "The pricing page groups 4.0 pricing under Generate, Remix, Edit, Reframe and Replace Background, while the developer reference exposes V4 endpoints only for Generate and Remix and labels those other model-specific routes as V3."
handling = "Record only the V4 Generate and Remix image-output profiles; do not infer V4 Edit, Reframe, or Replace Background endpoints from grouped pricing copy."
source_ids = ["pricing", "generate-api", "remix-api"]

[[conflicts]]
path = "api_identifiers.ideogram-4.0"
summary = "Marketing sample code shows model=ideogram-4.0, while the production API reference selects V4 through endpoint-specific routes and exposes no model request parameter."
handling = "Do not record the marketing pseudo-parameter as a served API identifier; preserve the exact endpoint paths on capability profiles."
source_ids = ["model-page", "generate-api", "remix-api"]

[[conflicts]]
path = "pricing.source_revision"
summary = "The live pricing page displays a last-revised date of August 6, 2025 even though it contains Ideogram 4.0 rates for the model released in June 2026."
handling = "Use the live values as retrieved on 2026-08-10 and retain the stale displayed revision date as provenance."
source_ids = ["pricing", "release-announcement"]

[[conflicts]]
path = "capability_profiles.*.controls.color_palette"
summary = "The hosted JSON schema accepts six-digit hexadecimal colors in either case, while the open-weight CaptionVerifier guide requires uppercase #RRGGBB values and stricter palette limits."
handling = "Keep hosted and open-weight prompting rules scoped to their separate profiles and do not imply that the open CaptionVerifier restrictions govern the hosted API."
source_ids = ["generate-api", "open-prompting"]

[[conflicts]]
path = "capability_profiles.open-weights-text-to-image.controls.magic_prompt"
summary = "Ideogram says the Magic Prompt shipped with the open package is not the same system used in the production Ideogram product, including when the package calls the Ideogram-hosted ideogram-4-v1 service."
handling = "Do not treat open-package and production Magic Prompt results as equivalent or derive capability values across them."
source_ids = ["open-prompting", "magic-prompt-api"]

