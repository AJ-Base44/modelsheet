[[limitations]]
id = "native-editable-layers-not-yet-available"
summary = "Ideogram says current 4.0 inference does not yet return alpha channels, editable text layers, or movable image layers directly; those are planned for a follow-up release and currently require separate tools."
source_ids = ["model-page", "release-announcement"]

[[limitations]]
id = "open-weights-plain-text-prompts"
summary = "Ideogram says passing plain text directly to the open-weight model will not work and will likely trigger a safety warning; a structured JSON prompt or Magic Prompt is required for usable results."
source_ids = ["open-prompting"]

[[limitations]]
id = "open-weights-runtime-safety-filters"
summary = "Ideogram says supported open-weight deployments must retain prompt and output NSFW moderation or equivalent stronger filters; disabling runtime screening is not a supported deployment configuration."
source_ids = ["open-safety"]

[[limitations]]
id = "temporary-hosted-output-links"
summary = "Ideogram says hosted Generate and Remix image links remain available only for a limited period and must be downloaded for durable storage."
source_ids = ["generate-api", "remix-api"]

