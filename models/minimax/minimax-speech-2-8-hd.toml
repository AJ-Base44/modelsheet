[[conflicts]]
path = "capability_profiles.text-to-speech-async.reference_inputs.text_file"
summary = "The async schema marks both text and text_file_id required, while its descriptions state that they are mutually exclusive and exactly one is required."
handling = "Represent direct text and file input as alternate endpoint-scoped inputs; do not require both."
source_ids = ["async-reference"]

[[conflicts]]
path = "capability_profiles.*.delivery_profiles.*.formats"
summary = "Current request schemas accept MP3, PCM, FLAC, WAV, PCMU, and Opus, while response metadata enums on some surfaces still list only MP3, PCM, and FLAC."
handling = "Use request-side format enums for caller capability and retain the response enum mismatch as conflicting provenance."
source_ids = ["http-reference", "websocket-reference", "async-reference"]

[[conflicts]]
path = "capability_profiles.text-to-speech-http.reference_inputs.voice"
summary = "The voice_setting schema marks voice_id required, while the same reference instructs callers to leave voice_id empty when timbre_weights is used."
handling = "Represent single-voice and mixed-voice inputs separately and do not require the single voice when mixing."
source_ids = ["http-reference"]

[[conflicts]]
path = "capability_profiles.*.controls.emotion"
summary = "The shared emotion enum prints fluent and whisper, but its model applicability text limits both to Speech 2.6 and explicitly says Speech 2.8 does not support whisper."
handling = "Expose the seven model-guide emotions for Speech 2.8 and list fluent and whisper as unsupported values."
source_ids = ["model-guide", "http-reference", "websocket-reference", "async-reference"]

[[conflicts]]
path = "capability_profiles.text-to-speech-http.audio_formats.opus"
summary = "The synchronous request lists a general sample-rate enum but does not publish the valid Opus-specific combinations; the async reference publishes a distinct Opus set including 12 kHz and 48 kHz."
handling = "Keep synchronous Opus sample-rate combinations unknown and scope the exact Opus set to the async profile."
source_ids = ["http-reference", "async-reference"]

