[[limitations]]
id = "whisper-emotion-unavailable"
summary = "Speech 2.8 does not support the whisper emotion; fluent and whisper are limited to Speech 2.6 models."
source_ids = ["http-reference", "websocket-reference", "async-reference"]

[[limitations]]
id = "latex-chinese-only"
summary = "LaTeX reading is available only for Chinese and forces language_boost to Chinese."
source_ids = ["http-reference", "websocket-reference", "async-reference"]

[[limitations]]
id = "temporary-url-expiry"
summary = "Non-streaming HTTP output URLs expire after 24 hours; asynchronous task download URLs expire after nine hours."
source_ids = ["http-reference", "async-reference", "async-query"]

