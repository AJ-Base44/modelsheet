source_ids = ["music-reference"]

[capability_profiles.frame_rate]
state = "not_applicable"
source_ids = ["music-reference"]

[capability_profiles.size]
state = "not_applicable"
source_ids = ["music-reference"]

[capability_profiles.native_audio]
state = "not_applicable"
source_ids = ["music-reference"]

[[capability_profiles.audio_formats]]
family = "mp3"
sample_rate_mode = "exact_set"
sample_rate_unit = "hertz"
sample_rates = [16000, 24000, 32000, 44100]
bitrate_mode = "exact_set"
