bitrate_mode = "exact_set"
bitrate_unit = "kilobit_per_second"
bitrates = [32, 64, 128, 256]
source_ids = ["music-reference"]

[[capability_profiles.delivery_profiles]]
id = "hex-response"
state = "supported"
transport = "hex_in_response"
endpoint = "POST /v1/music_generation"
formats = ["hex"]
default_format = "hex"
source_ids = ["music-reference"]

[[capability_profiles.delivery_profiles]]
id = "temporary-url"
state = "supported"
transport = "temporary_url"
endpoint = "POST /v1/music_generation"
formats = ["url"]
