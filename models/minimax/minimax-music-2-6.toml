[[capability_profiles.delivery_profiles]]
id = "streaming-hex"
state = "supported"
transport = "http_stream"
endpoint = "POST /v1/music_generation"
formats = ["hex"]
source_ids = ["music-reference"]

[[capability_profiles.controls]]
name = "lyrics_length_when_present"
state = "supported"
mode = "range"
min = 1
max = 3500
step = 1
unit = "character"
source_ids = ["music-reference"]

[[capability_profiles.controls]]
name = "stream"
state = "supported"
mode = "exact_set"
values = ["true", "false"]
default = "false"
source_ids = ["music-reference"]

[[capability_profiles.controls]]
name = "output_format"
state = "supported"
mode = "exact_set"
values = ["url", "hex"]
default = "hex"
source_ids = ["music-reference"]

[[capability_profiles.controls]]
name = "sample_rate"
state = "supported"
mode = "exact_set"
values = ["16000", "24000", "32000", "44100"]
