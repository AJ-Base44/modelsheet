source_ids = ["music-reference"]

[[capability_profiles.controls]]
name = "audio_format"
state = "supported"
mode = "exact_set"
values = ["mp3", "wav", "pcm"]
source_ids = ["music-reference"]

[[capability_profiles.controls]]
name = "lyrics_optimizer"
state = "supported"
mode = "exact_set"
values = ["true", "false"]
default = "false"
source_ids = ["music-reference"]

[[capability_profiles.controls]]
name = "is_instrumental"
state = "supported"
mode = "exact_set"
values = ["true", "false"]
default = "false"
source_ids = ["music-reference"]

[pricing]
state = "known"
source_ids = ["paygo-pricing"]

[[pricing.charges]]
id = "paid-generation"
state = "known"
kind = "metered"
amount = 0.15
denomination = "USD"
per = 1
unit = "music_generation"
profile_id = "music-generation"
applies_when = ["model_id=music-2.6", "output_duration<=5_minutes"]
source_ids = ["paygo-pricing"]

[[conflicts]]
path = "capability_profiles.music-generation.duration"
summary = "MiniMax prices each paid generation as up to five minutes of music, but the live request schema exposes no duration control or explicit output-duration constraint."
handling = "Keep the capability duration unknown and preserve the five-minute phrase only as a billing qualifier."
source_ids = ["music-reference", "paygo-pricing"]

