[[conflicts]]
path = "capability_profiles.*.size.default"
summary = "The API schema gives width and height defaults of 0 despite a minimum of 64, while the dimensions table publishes a 1024x1024 default."
handling = "Use the explicit 1024x1024 default from the dimensions table; retain the API contradiction as provenance rather than interpreting 0."
source_ids = ["pro-api", "dimensions-help"]

[[conflicts]]
path = "capability_profiles.image-edit.reference_inputs.image_reference.max_count"
summary = "The model overview says the REST API accepts 8 references and the playground accepts 10, while broader editing material describes up to 10 without always naming the interface."
handling = "Use 8 for the recorded REST endpoint because its live request schema exposes input_image through input_image_8; do not apply the playground limit to the API."
source_ids = ["pro-api", "overview", "image-editing-guide"]

[[conflicts]]
path = "api_identifiers.flux-2-pro-preview"
summary = "BFL documents flux-2-pro as a fixed snapshot and flux-2-pro-preview as a mutable latest endpoint; their contracts match but their underlying weights differ."
handling = "Record only the fixed flux-2-pro endpoint here and do not collapse the preview endpoint into an alias until its changing release identity can be represented safely."
source_ids = ["overview", "pro-api", "pro-preview-api"]

