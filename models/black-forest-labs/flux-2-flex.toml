[[conflicts]]
path = "capability_profiles.*.size.default"
summary = "The API schema gives width and height defaults of 0 despite a minimum of 64, while the dimensions table publishes a 1024x1024 default."
handling = "Use the explicit 1024x1024 default from the dimensions table; retain the API contradiction as provenance rather than interpreting 0."
source_ids = ["flex-api", "dimensions-help"]

[[conflicts]]
path = "capability_profiles.image-edit.reference_inputs.image_reference.max_count"
summary = "The model overview says the REST API accepts 8 references and the playground accepts 10, while broader editing material describes up to 10 without always naming the interface."
handling = "Use 8 for the recorded REST endpoint because its live request schema exposes input_image through input_image_8; do not treat input_image_blob_path as a ninth image slot without documented semantics."
source_ids = ["flex-api", "overview", "image-editing-guide"]

[[conflicts]]
path = "pricing.charges.*"
summary = "The live pricing page, pricing table and help article publish USD 0.05 per megapixel, while the FLUX.2 overview comparison still says USD 0.06 per megapixel."
handling = "Use USD 0.05 from the dedicated current pricing surfaces and retain the overview value as conflicting provenance."
source_ids = ["pricing-live", "pricing-docs", "pricing-help", "overview"]

