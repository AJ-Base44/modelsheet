[[conflicts]]
path = "capability_profiles.*.size.default"
summary = "The API schema gives width and height defaults of 0 despite a minimum of 64, while the dimensions table publishes a 1024x1024 default."
handling = "Use the explicit 1024x1024 default from the dimensions table; retain the API contradiction as provenance rather than interpreting 0."
source_ids = ["max-api", "dimensions-help"]

[[conflicts]]
path = "capability_profiles.image-edit.reference_inputs.image_reference.max_count"
summary = "The model overview says the REST API accepts 8 references and the playground accepts 10, while the Max model page and broader editing material describe multiple references without exposing another REST parameter."
handling = "Use 8 for the recorded REST endpoint because its live request schema exposes input_image through input_image_8; do not apply a playground limit to the API."
source_ids = ["max-api", "overview", "max-model-page", "image-editing-guide"]

