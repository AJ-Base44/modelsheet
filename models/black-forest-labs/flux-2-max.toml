state = "known"
source_ids = ["pricing-live", "pricing-docs", "pricing-help"]

[[pricing.charges]]
id = "text-to-image-first-output-megapixel"
state = "known"
kind = "metered"
amount = 0.07
denomination = "USD"
per = 1
unit = "output_megapixel"
profile_id = "text-to-image"
applies_when = ["first output megapixel"]
qualifier = "Each image is rounded up separately for billing; 1 megapixel is counted as 1024x1024."
