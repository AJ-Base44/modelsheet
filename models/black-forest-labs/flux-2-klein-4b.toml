[[conflicts]]
path = "capability_profiles.*.size.default"
summary = "The live API schema gives width and height defaults of 0 despite a minimum of 64, while the dimensions table publishes a 1024x1024 default."
handling = "Use the explicit 1024x1024 default from the dimensions table and retain the API contradiction rather than interpreting 0 as an output size."
source_ids = ["klein-api", "openapi", "dimensions-help"]

[[conflicts]]
path = "pricing.charges.text-to-image-*"
summary = "The quick-start pricing prose contains a malformed duplicated term in its 4B example, while the live pricing table and help example agree on the first-megapixel plus additional-megapixel formula."
handling = "Use the dedicated live pricing table and worked help example; retain the malformed quick-start expression as conflicting provenance."
source_ids = ["pricing-live", "pricing-docs", "pricing-help"]

