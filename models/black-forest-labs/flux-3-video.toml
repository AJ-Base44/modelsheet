[[conflicts]]
path = "model.name"
summary = "BFL uses FLUX 3 for the multimodal family heading and FLUX 3 Video for the released video product and API capability."
handling = "Use FLUX 3 Video for this video-model record; do not collapse future FLUX 3 modality releases into it without new source review."
source_ids = ["launch", "model-page"]

[[conflicts]]
path = "model.status"
summary = "The dated launch announcement says generally available; the undated overview still says preview."
handling = "Use available from the dated 2026-08-04 launch and retain both sources."
source_ids = ["launch", "overview"]

[[conflicts]]
path = "capability_profiles.video-continuation.duration.max"
summary = "The live OpenAPI allows 5-20 seconds; the overview table says 5-15 seconds."
handling = "Use 20 from the callable API contract and keep the overview as conflicting provenance."
source_ids = ["openapi", "overview"]

[[conflicts]]
path = "pricing.charges.v2v-standard-hd,pricing.charges.v2v-standard-fhd"
summary = "The main pricing page and model FAQ publish USD 0.41/0.53 per second; the docs pricing table publishes USD 0.43/0.54."
handling = "Use the matching values from the current calculator and model FAQ."
source_ids = ["pricing", "model-page", "docs-pricing"]

[[conflicts]]
path = "capability_profiles.*.size.options.fhd"
summary = "BFL labels the tier Full HD / 1080p but its exact 16:9 example is 1920x1088."
handling = "Preserve both the published tier label and the exact example; do not normalize it to 1920x1080."
source_ids = ["overview"]

[[conflicts]]
path = "pricing.charges.draft-enhance-hd"
summary = "The API permits HD or FHD enhancement, while the model FAQ only states the corresponding standard FHD price."
handling = "Keep HD enhancement pricing unknown."
source_ids = ["openapi", "model-page"]

