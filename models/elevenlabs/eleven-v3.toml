[[conflicts]]
path = "capability_profiles.text-to-speech.text_input.max"
summary = "Official pages publish 5,000, 3,000, and grouped 40,000-character limits, and the anonymous runtime model catalog could not resolve them."
handling = "Use 5,000 from the model-specific reference, retain the differently scoped product-card claims as conflicts, and keep the separate output-duration range unknown."
source_ids = ["models", "tts-product", "pricing", "openapi"]

[[conflicts]]
path = "language_support"
summary = "The model reference says 70+ languages and lists 74; the grouped API pricing card says 32."
handling = "Use the model-specific published list and retain the grouped pricing claim as conflicting provenance."
source_ids = ["models", "pricing"]

[[conflicts]]
path = "capability_profiles.text-to-dialogue.reference_inputs.voice.max_count"
summary = "The endpoint schema caps unique voice IDs at ten; the dialogue overview FAQ says there is no speaker limit."
handling = "Use ten for API selection because it is the callable request constraint."
source_ids = ["dialogue-reference", "dialogue-overview"]

[[conflicts]]
path = "model.status"
summary = "Dated February 2026 sources say generally available and out of alpha, while some best-practices copy still says research preview."
handling = "Use available from the dated GA sources."
source_ids = ["ga-blog", "ga-changelog", "best-practices"]

[[conflicts]]
path = "capability_profiles.*.delivery_profiles.*.formats"
summary = "The prose PCM description is internally inconsistent with the endpoint format enums."
handling = "Use the exact endpoint enums."
source_ids = ["dialogue-overview", "tts-reference", "dialogue-reference"]

