state = "supported"
transport = "websocket"
endpoint = "GET /v1/text-to-speech/{voice_id}/stream-input"
source_ids = ["websocket-reference", "websocket-guide"]

[[capability_profiles.controls]]
name = "seed"
state = "supported"
mode = "range"
min = 0
max = 4294967295
step = 1
unit = "integer"
source_ids = ["tts-reference"]

[[capability_profiles.controls]]
name = "apply_text_normalization"
state = "supported"
mode = "exact_set"
values = ["auto", "on", "off"]
