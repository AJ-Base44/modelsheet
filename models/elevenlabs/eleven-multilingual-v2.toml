endpoints = [
  "POST /v1/text-to-speech/{voice_id}/with-timestamps",
  "POST /v1/text-to-speech/{voice_id}/stream/with-timestamps",
]
metadata = ["alignment", "normalized_alignment"]
source_ids = ["tts-timing-reference", "tts-stream-timing-reference"]

[pricing]
state = "known"
