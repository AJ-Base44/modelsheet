  "mp3_22050_32", "mp3_24000_48", "mp3_44100_32", "mp3_44100_64",
  "mp3_44100_96", "mp3_44100_128", "mp3_44100_192",
  "pcm_8000", "pcm_16000", "pcm_22050", "pcm_24000", "pcm_32000",
  "pcm_44100", "pcm_48000",
