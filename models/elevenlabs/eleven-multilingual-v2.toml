[[conflicts]]
path = "language_support,capability_profiles.text-to-speech.text_input.max"
summary = "The model-specific documentation lists 29 languages and a 10,000-character limit, while the grouped Multilingual v2/v3 pricing card says 32 languages and a 40,000-character limit."
handling = "Use the model-specific values for this record and retain the grouped pricing-card claims only as conflicting provenance."
source_ids = ["models", "pricing"]

