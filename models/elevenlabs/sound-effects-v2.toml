[[capability_profiles.audio_formats]]
family = "opus"
sample_rate_mode = "exact_set"
sample_rate_unit = "hertz"
sample_rates = [48000]
bitrate_mode = "exact_set"
bitrate_unit = "kilobit_per_second"
bitrates = [32, 64, 96, 128, 192]
source_ids = ["sound-effects-reference"]

[[capability_profiles.audio_formats]]
family = "ulaw"
sample_rate_mode = "exact_set"
sample_rate_unit = "hertz"
sample_rates = [8000]
source_ids = ["sound-effects-reference"]

[[capability_profiles.audio_formats]]
family = "alaw"
sample_rate_mode = "exact_set"
sample_rate_unit = "hertz"
sample_rates = [8000]
source_ids = ["sound-effects-reference"]

[[capability_profiles.audio_format_access]]
format_ids = ["mp3_44100_192"]
minimum_plan = "Creator"
source_ids = ["sound-effects-reference"]

[[capability_profiles.audio_format_access]]
format_ids = ["pcm_44100"]
minimum_plan = "Pro"
source_ids = ["sound-effects-reference"]

[[capability_profiles.delivery_profiles]]
id = "audio-download"
state = "supported"
transport = "http_response"
endpoint = "POST /v1/sound-generation"
formats = [
  "mp3_22050_32", "mp3_24000_48", "mp3_44100_32",
  "mp3_44100_64", "mp3_44100_96", "mp3_44100_128",
  "mp3_44100_192", "pcm_8000", "pcm_16000", "pcm_22050",
  "pcm_24000", "pcm_32000", "pcm_44100", "pcm_48000",
  "opus_48000_32", "opus_48000_64", "opus_48000_96",
  "opus_48000_128", "opus_48000_192", "ulaw_8000", "alaw_8000",
]
source_ids = ["sound-effects-reference"]

[[capability_profiles.controls]]
name = "loop"
state = "supported"
mode = "exact_set"
values = ["true", "false"]
default = "false"
source_ids = ["sound-effects-reference"]

[[capability_profiles.controls]]
name = "prompt_influence"
state = "supported"
mode = "range"
min = 0
max = 1
default = 0.3
unit = "ratio"
source_ids = ["sound-effects-reference"]

[[limitations]]
id = "complex-sequences-best-composed"
summary = "The model understands multi-effect sequences, but ElevenLabs recommends generating individual effects and combining them in an audio editor for best results."
source_ids = ["prompting-help"]

[pricing]
state = "partial"
source_ids = ["pricing", "credits-pricing"]

[[pricing.charges]]
id = "sound-effects-api-output"
state = "known"
kind = "metered"
amount = 0.12
denomination = "USD"
per = 1
unit = "output_minute"
profile_id = "sound-effect-generation"
qualifier = "Prices exclude taxes, levies, and duties."
source_ids = ["pricing"]

[[pricing.charges]]
id = "sound-effects-api-automatic-duration"
state = "known"
kind = "metered"
amount = 100
denomination = "credit"
per = 1
unit = "generation"
profile_id = "sound-effect-generation"
applies_when = ["duration=automatic"]
qualifier = "One sound effect is returned per API generation."
source_ids = ["credits-pricing"]

[[pricing.charges]]
id = "sound-effects-api-specified-duration"
state = "known"
kind = "metered"
amount = 11
denomination = "credit"
per = 1
unit = "output_second"
profile_id = "sound-effect-generation"
applies_when = ["duration=specified"]
qualifier = "Text-input length does not affect the charge."
source_ids = ["credits-pricing"]

[[conflicts]]
path = "capability_profiles.sound-effect-generation.duration.min"
summary = "The capability overview states a 0.1-second minimum, while the live API parameter table requires at least 0.5 seconds."
handling = "Use 0.5 seconds for the endpoint-scoped API profile."
source_ids = ["sound-effects-overview", "sound-effects-reference"]

[[conflicts]]
path = "capability_profiles.sound-effect-generation.delivery_profiles.audio-download.formats"
summary = "The overview says every effect is available as MP3 and non-looping effects as 48 kHz WAV, while the live API enum exposes MP3, PCM, Opus, u-law, and A-law and has no WAV selector; response prose still calls the result MP3."
handling = "Use the exact request enum for the API profile and retain the overview and response prose as conflicting provenance."
source_ids = ["sound-effects-overview", "sound-effects-reference"]

[[conflicts]]
path = "capability_profiles.sound-effect-generation.text_input.max"
summary = "The website product UI documents a 450-character prompt maximum, while the API parameter table publishes no text maximum."
handling = "Keep the API text limit unknown; do not apply the website UI limit to the API."
source_ids = ["website-product-help", "sound-effects-reference"]

[[conflicts]]
path = "pricing"
summary = "The current API pricing page publishes USD 0.12 per minute and says Sound Effects is billed per generation, while the product-specific API billing page publishes 100 credits per automatic-duration generation or 11 credits per specified second."
handling = "Preserve all official charge representations with their conditions; do not convert credits or infer equivalence."
source_ids = ["pricing", "credits-pricing"]

