schema_version = 1

documentation_state = "documented"

[model]
id = "elevenlabs/sound-effects-v2"
name = "Sound effects"
lab = "ElevenLabs"
modality = "audio"
status = "unknown"
source_ids = ["models", "sound-effects-overview", "sound-effects-reference"]

[[api_identifiers]]
kind = "model_id"
value = "eleven_text_to_sound_v2"
source_ids = ["models", "sound-effects-reference"]

[verification]
state = "unverified"

[[capability_profiles]]
id = "sound-effect-generation"
task = "sound_effect_generation"
endpoint = "POST /v1/sound-generation"
source_ids = ["sound-effects-reference", "sound-effects-overview"]

[capability_profiles.duration]
state = "supported"
mode = "range"
unit = "second"
min = 0.5
max = 30
automatic = true
source_ids = ["sound-effects-reference"]

[capability_profiles.text_input]
state = "unknown"
source_ids = ["sound-effects-reference", "website-product-help"]

[capability_profiles.frame_rate]
state = "not_applicable"
source_ids = ["sound-effects-overview"]

[capability_profiles.size]
state = "not_applicable"
source_ids = ["sound-effects-overview"]

[capability_profiles.native_audio]
state = "not_applicable"
source_ids = ["sound-effects-overview"]

[[capability_profiles.audio_formats]]
family = "mp3"
sample_rate_mode = "exact_set"
sample_rate_unit = "hertz"
sample_rates = [22050]
bitrate_mode = "exact_set"
bitrate_unit = "kilobit_per_second"
bitrates = [32]
source_ids = ["sound-effects-reference"]

[[capability_profiles.audio_formats]]
family = "mp3"
sample_rate_mode = "exact_set"
sample_rate_unit = "hertz"
sample_rates = [24000]
bitrate_mode = "exact_set"
bitrate_unit = "kilobit_per_second"
bitrates = [48]
source_ids = ["sound-effects-reference"]

[[capability_profiles.audio_formats]]
family = "mp3"
sample_rate_mode = "exact_set"
sample_rate_unit = "hertz"
sample_rates = [44100]
bitrate_mode = "exact_set"
bitrate_unit = "kilobit_per_second"
bitrates = [32, 64, 96, 128, 192]
source_ids = ["sound-effects-reference"]

[[capability_profiles.audio_formats]]
family = "pcm"
sample_rate_mode = "exact_set"
sample_rate_unit = "hertz"
sample_rates = [8000, 16000, 22050, 24000, 32000, 44100, 48000]
