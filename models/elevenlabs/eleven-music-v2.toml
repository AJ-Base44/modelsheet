[[conflicts]]
path = "capability_profiles.*.duration.max"
summary = "The Music overview states a five-minute maximum, while the live generation endpoints and v2 composition-plan guide permit a 600-second total."
handling = "Use the callable endpoint's 600-second bound only inside endpoint-scoped API profiles; do not generalize it to the UI."
source_ids = ["music-overview", "compose-reference", "stream-reference", "detailed-reference", "detailed-stream-reference", "composition-guide"]

[[conflicts]]
path = "capability_profiles.music-compose.reference_inputs.audio_reference"
summary = "The capability overview says an audio reference may be approximately 30 seconds, while the newer official References release says uploads may be 10 seconds to five minutes and are available through ElevenAPI; no matching parameter reference was published."
handling = "Record support and copyright screening, but keep the duration and API request shape unresolved."
source_ids = ["music-overview", "references-release"]

[[conflicts]]
path = "capability_profiles.*.delivery_profiles.*.formats"
summary = "The overview advertises MP3 at 44.1 kHz and WAV, while current endpoint enums include 48 kHz MP3, PCM, Opus, u-law, and A-law but no WAV selector."
handling = "Use exact endpoint enums for API profiles and retain the overview claim only as conflicting provenance."
source_ids = ["music-overview", "compose-reference", "stream-reference", "detailed-reference", "detailed-stream-reference"]

[[conflicts]]
path = "pricing.charges.music-api-output"
summary = "The pricing table publishes USD 0.15 per minute, while the pricing FAQ describes Music as billed per generation."
handling = "Record the displayed USD per-minute charge and preserve the FAQ wording as a billing conflict."
source_ids = ["pricing"]

