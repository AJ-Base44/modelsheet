[[limitations]]
id = "audio-reference-not-remixing"
summary = "Audio Reference guides style and sound; it is not a remixing or genre-transfer tool, and substantially different requested genres may be less reliable."
source_ids = ["music-overview"]

[[limitations]]
id = "seed-not-exactly-reproducible"
summary = "Using the same seed and parameters does not guarantee exact reproducibility, and output can change across system updates."
source_ids = ["compose-reference"]

[[limitations]]
id = "copyright-screening"
summary = "Copyrighted prompts, styles, lyrics, and uploaded material can be rejected; an uploaded copyrighted file is still charged half the request cost."
source_ids = ["composition-guide", "upload-reference"]

