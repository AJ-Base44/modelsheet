[[conflicts]]
path = "capability_profiles.web-text-to-video-*.duration,capability_profiles.web-image-to-video-*.duration,capability_profiles.web-video-modify.duration"
summary = "Ray3.14's model-specific FAQ and user guide state 5- or 10-second text-to-video, 5-second image-to-video, and up to 18-second Modify input, while a summary table in Luma's video-model field guide lists 4, 8, and 12 seconds with roughly 18 seconds of orchestration."
handling = "Use the exact model-specific FAQ and user-guide values; keep Modify output duration unknown because the 18-second claim is an input-video limit."
source_ids = ["user-guide", "model-faq", "model-field-guide"]

[[conflicts]]
path = "capability_profiles.web-*-hdr-exr.size.options"
summary = "Luma's color-space guide says EXR export is available at 540p and 720p, while an official credit surface also publishes 1080p HDR+EXR charges."
handling = "Expose 540p and 720p in HDR+EXR profiles and leave 1080p omitted until Luma resolves the serving-versus-pricing disagreement."
source_ids = ["color-guide", "credit-guide", "model-faq"]

[[conflicts]]
path = "capability_profiles.web-image-to-video-*.reference_inputs"
summary = "The model FAQ says the reference-image feature is unavailable, while Luma's keyframe guide and field guide document start and end keyframes."
handling = "Represent positional start/end keyframes as supported and the separate unpositioned character-reference role as unsupported."
source_ids = ["model-faq", "keyframes-guide", "model-field-guide"]

[[conflicts]]
path = "capability_profiles.*.native_audio.state"
summary = "The model FAQ explicitly says Ray3.14 has no native audio, while the broader field guide says audio generation is available in supported user interfaces."
handling = "Use unsupported for same-generation native audio and treat the field-guide statement as the separate Add Audio workflow."
source_ids = ["model-faq", "model-field-guide"]

[[conflicts]]
path = "api_identifiers"
summary = "The exact Ray3.14 FAQ says the model is Dream Machine Web-only, while Luma's API marketing page mentions Ray3.14 under other models without publishing a serving ID or parameter contract; current API enums list other Ray models."
handling = "Do not create an API identifier or API capability profile for Ray3.14."
source_ids = ["model-faq", "api-overview", "agents-model-guide", "agents-generation-reference"]

