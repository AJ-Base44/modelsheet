[[limitations]]
id = "public-api-unavailable"
summary = "Luma states that Ray3.14 is available only in Dream Machine Web and is not available through its public API."
source_ids = ["model-faq", "agents-model-guide", "agents-generation-reference"]

[[limitations]]
id = "character-reference"
summary = "Luma says Ray3.14 lacks character consistency and the unpositioned reference-image feature; positional start and end keyframes remain available."
source_ids = ["model-faq", "keyframes-guide"]

[[limitations]]
id = "reframe"
summary = "Luma states that Ray3.14 cannot be used with Reframe."
source_ids = ["model-faq"]

[[limitations]]
id = "native-audio"
summary = "Luma states that Ray3.14 does not generate native audio; audio can be added in a separate post-generation workflow."
source_ids = ["model-faq", "model-field-guide"]

[[limitations]]
id = "modify-hdr-exr"
summary = "Luma states that HDR and EXR are not supported in Modify."
source_ids = ["model-faq", "model-field-guide"]

[[limitations]]
id = "extension-length"
summary = "Luma states that Ray3.14 video can be extended up to approximately 30 seconds."
source_ids = ["user-guide", "model-faq"]

