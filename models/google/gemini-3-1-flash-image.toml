[[conflicts]]
path = "pricing.charges.pricing-token-usage-*"
summary = "The image guide lists 747, 1,120, 1,120, and 2,000 output tokens for 512/1K/2K/4K, while pricing and Agent material list 747, 1,120, 1,680, and 2,520."
handling = "Use the pricing page token counts only for pricing accounting and use Google's direct per-image USD charges rather than deriving prices from the conflicting guide table."
source_ids = ["image-guide", "gemini-pricing", "agent-model"]

[[conflicts]]
path = "pricing.charges.standard-output-image-4k.amount"
summary = "Gemini Developer pricing publishes USD 0.151 per 4K image, while Agent pricing rounds the same line to USD 0.15."
handling = "Use the more precise Gemini Developer amount and retain the rounding disagreement."
source_ids = ["gemini-pricing", "agent-pricing"]

[[conflicts]]
path = "capability_profiles.*.delivery_profiles.*.formats"
summary = "The Interactions API response-format reference lists JPEG, while official guide examples request PNG."
handling = "Keep JPEG on Interactions profiles and PNG on the separately scoped GenerateContent profile."
source_ids = ["interactions-api", "image-guide", "legacy-guide"]

[[conflicts]]
path = "capability_profiles.agent-image-generation.size.options.*.aspect_ratios"
summary = "Agent Platform lists an additional 9:21 ratio that is absent from both the model-specific Gemini guide and the Interactions API enum."
handling = "Omit 9:21 until the model-specific API surfaces agree that it is accepted."
source_ids = ["agent-model", "image-guide", "interactions-api"]

[[conflicts]]
path = "capability_profiles.interactions-text-to-image.size.options.512.examples.21:9"
summary = "Google's table labels the 512-tier value 21:9 but publishes dimensions of 792x168, which do not mathematically match 21:9 or the larger-tier scaling."
handling = "Preserve the exact published dimensions and do not silently normalize the source table."
source_ids = ["image-guide"]

[[conflicts]]
path = "capability_profiles.*.search_grounding"
summary = "Gemini Developer says search grounding is supported, while the Agent Platform model page says grounding is unsupported."
handling = "Do not assert a universal grounding capability; keep the disagreement scoped to the serving surfaces."
source_ids = ["gemini-model", "image-guide", "agent-model"]

[[conflicts]]
path = "capability_profiles.*.controls.thinking"
summary = "The image guide says thinking is enabled by default and cannot be disabled, while other Google material describes Image Search grounding with thinking on or off."
handling = "Omit a thinking control until the official surfaces agree."
source_ids = ["image-guide", "gemini-model"]

[[conflicts]]
path = "capability_profiles.*.controls.output_count"
summary = "Google says the model may not follow an exact requested image count and publishes no dependable model-specific maximum."
handling = "Keep output-count constraints unknown rather than inferring a limit."
source_ids = ["image-guide"]

