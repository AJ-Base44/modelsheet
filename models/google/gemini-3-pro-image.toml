[[conflicts]]
path = "capability_profiles.*.delivery_profiles.*.formats"
summary = "The Interactions API response-format reference lists JPEG, while official model-guide examples request PNG."
handling = "Keep JPEG on Interactions profiles and PNG on the separately scoped GenerateContent profile; do not assert one universal output format."
source_ids = ["interactions-api", "image-guide", "legacy-guide"]

[[conflicts]]
path = "capability_profiles.interactions-image-edit.reference_inputs.object_reference.max_count"
summary = "The typed reference table permits six high-fidelity object images, while another guide paragraph says five high-fidelity images."
handling = "Use six on the typed object-reference role and retain the prose inconsistency."
source_ids = ["image-guide"]

[[conflicts]]
path = "capability_profiles.agent-image-generation.size.options.4K"
summary = "The stable model is generally available, while Agent Platform describes 4K output as preview."
handling = "Keep the model available and mark only the Agent 4K size option with its published preview qualifier."
source_ids = ["gemini-changelog", "agent-model"]

[[conflicts]]
path = "capability_profiles.*.controls.thinking"
summary = "The image guide describes thinking as enabled by default and not disableable, while other Google material describes search grounding with thinking on or off."
handling = "Omit a thinking control until the official surfaces agree."
source_ids = ["image-guide", "gemini-model"]

[[conflicts]]
path = "capability_profiles.*.controls.output_count"
summary = "Google says the model may not follow an exact requested image count and publishes no dependable model-specific maximum."
handling = "Keep output-count constraints unknown rather than inferring a limit."
source_ids = ["image-guide"]

