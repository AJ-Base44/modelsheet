[[limitations]]
id = "text-only-input-audio-only-output"
summary = "Google says this TTS model accepts only text input and produces only audio output."
source_ids = ["tts-guide"]

[[limitations]]
id = "voice-prompt-mismatch"
summary = "Google says the generated voice can fail to match the requested prompt or assigned speaker."
source_ids = ["model-card"]

[[limitations]]
id = "long-output-quality-drift"
summary = "Google says quality and consistency can drift when output continues beyond a few minutes."
source_ids = ["model-card"]

[[limitations]]
id = "text-token-server-errors"
summary = "Google says the model can occasionally return text tokens instead of audio and cause an HTTP 500 response; retrying is advised."
source_ids = ["model-card"]

[[limitations]]
id = "vague-prompt-handling"
summary = "Google says vague prompts can trigger false PROHIBITED_CONTENT rejections or cause instructions to be read aloud."
source_ids = ["model-card"]

