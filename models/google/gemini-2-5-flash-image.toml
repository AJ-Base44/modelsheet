[[conflicts]]
path = "capability_profiles.*.delivery_profiles.*.formats"
summary = "The Interactions API response-format reference lists JPEG, while official GenerateContent guide examples return PNG."
handling = "Keep the formats scoped to their serving endpoints rather than selecting a single model-wide output format."
source_ids = ["interactions-api", "legacy-guide"]

[[conflicts]]
path = "capability_profiles.*.reference_inputs.video_reference,capability_profiles.*.reference_inputs.audio_reference"
summary = "The Gemini 2.5 Flash model card describes the broader base model as accepting audio and video, while the image-model page and image-generation guide expose text and image inputs for this image endpoint."
handling = "Use the image-model-specific API surface and mark audio and video references unsupported on these profiles; do not transfer base-model modalities to the image endpoint."
source_ids = ["model-card", "model-page", "image-guide"]

[[conflicts]]
path = "capability_profiles.*.controls.output_count"
summary = "Google says the model may not follow an exact requested image count and publishes no dependable model-specific maximum."
handling = "Keep output-count constraints unknown rather than inferring a limit."
source_ids = ["image-guide"]

