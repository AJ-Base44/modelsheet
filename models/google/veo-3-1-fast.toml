[[conflicts]]
path = "model.status,api_identifiers,capability_profiles.*.controls.output_count"
summary = "Gemini Developer publishes a Preview identifier and one output per request, while Agent Platform publishes a GA -001 identifier and up to four outputs."
handling = "Keep model-level status unknown and preserve separate Gemini Developer and Agent Platform profiles and identifiers."
source_ids = ["gemini-model", "gemini-guide", "agent-model", "gemini-changelog"]

[[conflicts]]
path = "capability_profiles.*.native_audio"
summary = "Gemini Developer says native audio is always on, while the Agent Platform model table says sound generation is unsupported and its pricing page nevertheless lists audio rates."
handling = "Keep native-audio state scoped to each service profile and retain both audio and silent Agent Platform charges without treating either as a universal model behavior."
source_ids = ["gemini-model", "gemini-guide", "agent-model", "agent-pricing"]

[[conflicts]]
path = "capability_profiles.agent-*.size.options,pricing.charges.agent-*-4k"
summary = "The Agent Platform model table lists Fast output only at 720p and 1080p, while Agent pricing publishes Fast 4K audio and silent rates and Gemini Developer documents 4K output."
handling = "Omit 4K from Agent capability profiles, retain the explicitly published Agent 4K charges, and keep Gemini 4K in its separate service profiles."
source_ids = ["gemini-guide", "agent-model", "agent-pricing"]

[[conflicts]]
path = "capability_profiles.*.reference_inputs.start_video"
summary = "The Agent Platform modality table says video input is unsupported while also listing video extension as supported."
handling = "Record extension only in the Gemini Developer profile, where its input and duration constraints are explicit."
source_ids = ["agent-model", "gemini-guide"]

