[[limitations]]
id = "hallucinations"
summary = "Google says generated images can contain hallucinated content."
source_ids = ["model-card"]

[[limitations]]
id = "latency-and-timeouts"
summary = "Google reports that some requests can be slow or time out."
source_ids = ["model-card"]

[[limitations]]
id = "small-long-and-page-length-text"
summary = "Google says small, long, or page-length text can render poorly."
source_ids = ["model-card"]

[[limitations]]
id = "character-consistency"
summary = "Google says character consistency across generations is not always maintained."
source_ids = ["model-card"]

[[limitations]]
id = "masked-and-doodle-edits"
summary = "Google says masked or doodle edits can follow instructions only partially or leave persistent marks."
source_ids = ["model-card"]

[[limitations]]
id = "input-copying"
summary = "Google reports infrequent cases where generated output copies and pastes the input image."
source_ids = ["model-card"]

[[limitations]]
id = "spatial-reasoning"
summary = "Google reports occasional left-right confusion and limitations in spatial or 3D reasoning."
source_ids = ["model-card"]

[[limitations]]
id = "factual-and-world-knowledge"
summary = "Google says limited world knowledge can produce factual inaccuracies in generated images."
source_ids = ["model-card"]

