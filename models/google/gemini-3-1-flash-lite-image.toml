[[conflicts]]
path = "capability_profiles.*.size.options.1K.aspect_ratios"
summary = "The model page says the 1K tier has 14 aspect ratios but explicitly names only 10 of them."
handling = "Record only the 10 ratios enumerated on the model-specific page; do not import the four additional ratios from a generic endpoint enum."
source_ids = ["model-page", "interactions-api"]

[[conflicts]]
path = "capability_profiles.*.delivery_profiles.*.formats"
summary = "The Interactions API response-format reference lists JPEG, while official GenerateContent guide examples return PNG."
handling = "Keep the formats scoped to their serving endpoints rather than selecting a single model-wide output format."
source_ids = ["interactions-api", "legacy-guide"]

[[conflicts]]
path = "capability_profiles.*.reference_inputs.video_reference,capability_profiles.*.reference_inputs.audio_reference"
summary = "The DeepMind model card describes broader audio and video comprehension, while the model-specific image API page and task guide expose text and image inputs for image generation."
handling = "Use the model-specific image serving surface and mark audio and video references unsupported on these profiles; retain the broader model-card claim as a conflict."
source_ids = ["model-card", "model-page", "image-guide"]

[[conflicts]]
path = "capability_profiles.*.controls.input_token_limit,capability_profiles.*.controls.output_token_limit"
summary = "The model page publishes 65,536 input tokens and 4,096 output tokens, while the model card describes a broader 1M-token context and 64K text output."
handling = "Use the model-specific API page limits and retain the differently scoped model-card figures as a conflict."
source_ids = ["model-page", "model-card"]

