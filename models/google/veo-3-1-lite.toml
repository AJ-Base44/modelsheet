[[conflicts]]
path = "api_identifiers,capability_profiles.*.controls.output_count"
summary = "Gemini Developer publishes a Preview identifier and one output per request, while Agent Platform publishes a -001 identifier and up to four outputs."
handling = "Preserve separate service identifiers and capability profiles rather than selecting one service contract as universal."
source_ids = ["gemini-model", "gemini-guide", "agent-model"]

[[conflicts]]
path = "capability_profiles.video_extension"
summary = "The Gemini model page and guide say Veo 3.1 Lite does not support extension, while the Agent Platform model table labels extension supported even though that same table marks video input unsupported."
handling = "Do not record an extension profile until Google publishes a consistent callable contract for the Lite model."
source_ids = ["gemini-model", "gemini-guide", "agent-model"]

[[conflicts]]
path = "capability_profiles.*.native_audio"
summary = "Gemini Developer says native audio is always on, while Agent Platform says sound generation is supported and publishes both audio and silent rates without documenting a default."
handling = "Keep the always-on default only on Gemini Developer profiles and omit a default on Agent Platform profiles."
source_ids = ["gemini-guide", "agent-model", "agent-pricing"]

[[conflicts]]
path = "pricing.charges.*"
summary = "Agent Platform publishes per-second Lite rates while its model page says pay-as-you-go is not supported and fixed quota is supported."
handling = "Retain the published rate card as pricing metadata without implying that pay-as-you-go access is available."
source_ids = ["agent-model", "agent-pricing"]

