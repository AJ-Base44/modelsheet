[[conflicts]]
path = "model.status"
summary = "The model page marks GPT Image 2 as Default but does not publish a GA, preview, deprecated, or discontinued lifecycle term."
handling = "Keep registry status unknown instead of translating Default into a lifecycle claim."
source_ids = ["model-page"]

[[conflicts]]
path = "capability_profiles.*.delivery_profiles.partial-images"
summary = "The model page says streaming is not supported, while the image guide gives direct GPT Image 2 Image API streaming examples."
handling = "Record endpoint-level partial-image streaming as supported and retain the broader catalog conflict."
source_ids = ["model-page", "image-guide"]

[[conflicts]]
path = "capability_profiles.image-edit.reference_inputs.image_reference.max_count"
summary = "The generic edit reference says GPT image models accept up to sixteen images but currently omits GPT Image 2 from its model enum; the current guide demonstrates four GPT Image 2 inputs."
handling = "Keep the model-specific maximum unknown and record four only as a demonstrated count."
source_ids = ["image-guide", "edit-reference"]

[[conflicts]]
path = "capability_profiles.*.size"
summary = "The generated reference calls 3840x2160 the maximum, while the guide also lists 2160x3840."
handling = "Store the orientation-neutral edge, divisibility, pixel-count, and ratio constraints from the model guide."
source_ids = ["image-guide", "generation-reference"]

