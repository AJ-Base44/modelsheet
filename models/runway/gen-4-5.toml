qualifier = "Developer API credits; minimum purchase is USD 10 and sales tax may apply."
source_ids = ["api-pricing", "api-setup"]

[[conflicts]]
path = "capability_profiles.api-image-to-video.size.options"
summary = "The current image-to-video endpoint enum lists six sizes, while Runway's separate input guide additionally lists portrait 672:1584."
handling = "Use the six values accepted by the callable endpoint and retain 672:1584 only as conflicting provenance."
source_ids = ["api-reference", "input-guide"]

[[conflicts]]
path = "capability_profiles.*.native_audio.state"
summary = "Runway's GWM-1 research announcement says Gen-4.5 supports native audio generation and editing, while the current public model guide and API contract expose no Gen-4.5 audio control and describe the newer capabilities as coming to the web product."
handling = "Keep native audio unknown for the currently documented API and web profiles until a serving surface publishes an unambiguous availability contract."
source_ids = ["gwm-research", "model-guide", "api-reference"]

