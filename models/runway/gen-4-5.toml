[[limitations]]
id = "causal-reasoning"
summary = "Runway documents cases where an effect can appear before its cause."
source_ids = ["gen45-research"]

[[limitations]]
id = "object-permanence"
summary = "Runway documents that objects can disappear or appear unexpectedly across frames."
source_ids = ["gen45-research"]

[[limitations]]
id = "success-bias"
summary = "Runway documents a bias toward attempted actions succeeding."
source_ids = ["gen45-research"]

[[limitations]]
id = "static-shots"
summary = "Runway says truly static shots can be challenging, particularly establishing shots and wide landscapes."
source_ids = ["camera-guide"]

