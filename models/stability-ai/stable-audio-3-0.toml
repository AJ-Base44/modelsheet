[[conflicts]]
path = "capability_profiles.*.duration"
summary = "The API overview, release note, and pricing page describe output as up to six minutes, while the endpoint parameter tables accept output duration through 380 seconds and the model announcement describes more than six minutes."
handling = "Use the exact 1-to-380-second API parameter range and retain the rounded six-minute prose as conflicting provenance."
source_ids = ["api-reference", "release-notes", "announcement", "pricing"]

[[conflicts]]
path = "model.name, model.aliases"
summary = "The API reference, release note, and pricing page call the served model Stable Audio 3.0, while the launch announcement calls the API-served variant Stable Audio 3.0 Large."
handling = "Use the API-facing Stable Audio 3.0 name and retain Stable Audio 3.0 Large as a source-backed alias."
source_ids = ["api-reference", "release-notes", "announcement", "pricing"]

