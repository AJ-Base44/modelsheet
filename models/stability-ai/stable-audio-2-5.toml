[[conflicts]]
path = "capability_profiles.*.duration"
summary = "The model overview and pricing page describe output as up to three minutes, while the endpoint parameter tables accept output duration through 190 seconds."
handling = "Use the exact 1-to-190-second API parameter range and retain the rounded three-minute prose as conflicting provenance."
source_ids = ["api-reference", "pricing", "launch"]

[[conflicts]]
path = "capability_profiles.text-to-audio.controls.cfg_scale, capability_profiles.audio-to-audio.controls.cfg_scale"
summary = "The endpoint overview says cfg_scale applies only to stable-audio-2, while the same request schema publishes a Stable Audio 2.5 default of 1."
handling = "Expose the model-specific range and default from the parameter table and retain the applicability wording as conflicting provenance."
source_ids = ["api-reference"]

