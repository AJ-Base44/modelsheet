name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install site dependencies
        run: npm ci --prefix site

      - name: Validate source records
        run: npm run validate

      - name: Run tests
        run: npm test

      - name: Build deterministic API artifact
        run: npm run build

      - name: Check README coverage counts
        run: npm run check:readme

      - name: Run site acceptance tests
        run: npm test --prefix site

      - name: Build static site
        run: npm run build --prefix site
